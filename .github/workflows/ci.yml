name: Template checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn hardhat:test
      - run: yarn workspace @sh/nextjs test
      - run: yarn hardhat:check-types
      - run: yarn next:check-types
      - run: yarn lint
      - run: yarn workspace @sh/nextjs playwright install --with-deps chromium
      - run: yarn next:test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: packages/nextjs/test-results/
          retention-days: 7
